name: Build MouseStatus plugin (x64 + x86)

# 只编 MouseStatus 插件（纯 Win32，不依赖 MFC，因此不需要额外安装 VS 组件）。
# 触发方式：
#   - workflow_dispatch：手动构建，仅产出 artifact
#   - push tag MouseStatus_V*：构建并自动创建 Release，附上 x64/x86 两个 zip
on:
  workflow_dispatch:
  push:
    tags:
      - 'MouseStatus_V*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    name: MouseStatus.dll (Release ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch_name: x64
          - platform: Win32
            arch_name: x86

    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build plugin
        shell: pwsh
        run: |
          msbuild Plugins\MouseStatus\MouseStatus.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v143 `
            /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with exit code $LASTEXITCODE" }

      - name: Sanity checks
        shell: pwsh
        run: |
          $dll = "bin/${{ matrix.platform }}/Release/MouseStatus.dll"
          if (-not (Test-Path $dll)) { throw "MouseStatus.dll not produced at $dll" }
          $item = Get-Item $dll
          Write-Host "DLL: $($item.FullName)  $($item.Length) bytes"
          if ($item.Length -lt 20KB) { throw "dll looks too small ($($item.Length) bytes)" }

          # 1) 必须导出 TMPluginGetInstance（导出名以 ASCII 形式存在于导出表中）
          #    这里不用 dumpbin：setup-msbuild 只把 msbuild 加进 PATH，dumpbin 不保证可用
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $ascii.Contains('TMPluginGetInstance')) {
            throw "TMPluginGetInstance is not exported"
          }
          Write-Host "OK: TMPluginGetInstance exported"

          # 2) 文件版本必须与 tag 对应（tag MouseStatus_V1.2.0 → FileVersion 1.2.0.0）
          #    这里不写死具体版本号：以前写的是 '1.0.*'，结果 v1.1/v1.2 这样正常的版本升级
          #    会在这一步被自己拦下来（编译本身是成功的，白等一轮）。
          $fv = $item.VersionInfo.FileVersion
          $tagName = $env:GITHUB_REF_NAME
          if ($tagName -like 'MouseStatus_V*') {
            $expected = $tagName.Substring('MouseStatus_V'.Length)
            if ($fv -notlike "$expected.*") {
              throw "file version $fv does not match tag version $expected"
            }
            Write-Host "OK: file version $fv matches tag $tagName"
          }
          elseif ($fv -notlike '1.*') {
            throw "unexpected file version: $fv"
          }
          else {
            Write-Host "OK: file version $fv"
          }

          # 3) 中文界面文本必须按 UTF-16 正确落地（验证 /utf-8 生效）
          $uni = [System.Text.Encoding]::Unicode.GetString([System.IO.File]::ReadAllBytes($dll))
          foreach ($word in @('鼠标电量', '鼠标连接方式', '充电中', '蓝牙')) {
            if (-not $uni.Contains($word)) { throw "missing UTF-16 string: $word" }
          }
          Write-Host "OK: Chinese strings are UTF-16 encoded correctly"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.arch_name }}" | Out-Null
          Copy-Item "bin/${{ matrix.platform }}/Release/MouseStatus.dll" "dist/${{ matrix.arch_name }}/"
          Compress-Archive -Path "dist/${{ matrix.arch_name }}/*" `
            -DestinationPath "MouseStatus_${{ matrix.arch_name }}.zip" -Force
          Get-ChildItem *.zip | Format-Table Name, Length -AutoSize | Out-String | Write-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MouseStatus_${{ matrix.arch_name }}
          path: MouseStatus_${{ matrix.arch_name }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/MouseStatus_V')
    runs-on: ubuntu-latest
    name: Publish release
    steps:
      # 必须 checkout：发布说明文件（.github/release-notes/<tag>.md）就在仓库里，
      # 不 checkout 的话工作目录是空的，下面的 [ -f "$notes" ] 永远为假。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -l artifacts

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 标题用「MouseStatus V1.0.12」这种可读形式，而不是原始 tag 名
          title="${GITHUB_REF_NAME/MouseStatus_/MouseStatus }"

          # 正文优先用仓库里随版本提交的说明文件：.github/release-notes/<tag>.md
          # 没有该文件时退回自动生成的 changelog。
          # 这样发布说明跟着代码一起 review，不必事后手工改 Release。
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"

          # 幂等：Release 已存在时改为更新标题/正文并覆盖资产。
          # 好处是重推同一个 tag 就能刷新发布页（例如补发说明、重编 DLL）。
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release exists, updating"
            if [ -f "$notes" ]; then
              echo "using notes file: $notes"
              # gh release edit 没有 --generate-notes，所以只有拿到文件时才动正文
              gh release edit "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$title" \
                --notes-file "$notes"
            else
              gh release edit "${GITHUB_REF_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$title"
            fi
            gh release upload "${GITHUB_REF_NAME}" \
              artifacts/MouseStatus_x64.zip \
              artifacts/MouseStatus_x86.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          elif [ -f "$notes" ]; then
            echo "creating release with notes file: $notes"
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/MouseStatus_x64.zip \
              artifacts/MouseStatus_x86.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --notes-file "$notes"
          else
            echo "creating release with generated notes"
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/MouseStatus_x64.zip \
              artifacts/MouseStatus_x86.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --generate-notes
          fi
